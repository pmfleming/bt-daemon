[package]
name = "bt-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Bluetooth policy and API daemon for Shelllist"
repository = "https://github.com/pmfleming/bt-daemon"

[dependencies]
aes = "0.8"
anyhow = "1"
async-trait = "0.1"
bluer = { version = "0.17", features = ["bluetoothd", "l2cap", "rfcomm", "serde"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdh"] }
pipewire = { version = "0.10", features = ["v1_2_0"] }
rand = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
shelllist-daemon-core = { git = "https://github.com/pmfleming/daemon-framework.git", rev = "278bff245613293918ac7107ff8937e0f7e94fd6" }
shelllist-daemon-tokio = { git = "https://github.com/pmfleming/daemon-framework.git", rev = "278bff245613293918ac7107ff8937e0f7e94fd6" }
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", features = ["tokio"] }
zvariant = "5"
