<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="bt-rssi-helper">
    <allow own="org.laufan.BluetoothRssiHelper"/>
  </policy>
  <policy context="default">
    <deny own="org.laufan.BluetoothRssiHelper"/>
    <deny send_destination="org.laufan.BluetoothRssiHelper"/>
    <allow send_destination="org.laufan.BluetoothRssiHelper"
           send_interface="org.laufan.BluetoothRssiHelper1" send_member="Read"/>
    <allow send_destination="org.laufan.BluetoothRssiHelper"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.laufan.BluetoothRssiHelper"
           send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
  </policy>
</busconfig>
